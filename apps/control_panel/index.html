<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG400 Control</title>
  <style>
    :root{color-scheme:dark;font:13px system-ui,-apple-system,sans-serif;color:#dce4ed;background:#11161c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:48px 16px}
    button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #374350;border-radius:5px;background:#28323e;padding:6px 10px}button:hover:enabled{background:#344251}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #83bcf5;outline-offset:2px}
    .panel{width:min(580px,100%);border:1px solid #36424e;border-radius:10px;background:#1a222c;box-shadow:0 14px 55px #0004;overflow:hidden}
    header,footer{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#202a35}header h1{font-size:14px;font-weight:650;margin:0}header .mode{margin-left:auto;font-size:10px;letter-spacing:.08em;border:1px solid #49657c;color:#b2cee6;padding:3px 6px;border-radius:4px}
    main{padding:8px;display:grid;gap:8px}.sync{display:flex;align-items:center;gap:6px;min-height:32px;color:#9caebf;font-size:11px}.sync .dot{width:6px;height:6px;border-radius:50%;background:#758392}.sync .dot.on{background:#72c7ad}.sync .state{margin-right:auto}.sync button{font-size:11px;padding:4px 8px}
    .motion{border:1px solid #3b4c5f;border-radius:6px;background:#222d39;padding:10px}.motion h2{font-size:12px;margin:0 0 10px;display:inline-block;cursor:help}.columns,.row{display:grid;grid-template-columns:60px 82px minmax(0,1fr);gap:6px;align-items:center}.columns{font-size:10px;color:#8fa1b4;padding-bottom:5px}.row{min-height:37px}.label{font-weight:600;font-size:12px}.unit{display:block;color:#8295a7;font-weight:400;font-size:9px}.actual{font:12px ui-monospace,SFMono-Regular,monospace;color:#b0becc}.compound{display:flex;align-items:center;gap:6px;border:1px solid #42566a;border-radius:5px;background:#17212c;padding:3px 5px;height:30px;min-width:0}.compound input[type=range]{min-width:16px;width:100%;flex:1;accent-color:#86b6e1;height:18px}.compound input[type=number]{appearance:textfield;-moz-appearance:textfield;width:76px;border:0;border-left:1px solid #3c4c5d;background:transparent;color:#edf4fa;text-align:right;padding:2px 0 2px 5px;font:12px ui-monospace,SFMono-Regular,monospace}.compound input::-webkit-inner-spin-button{appearance:none}.actions{display:flex;justify-content:space-between;margin-top:10px}.primary{background:#7fb3df;color:#102034;border-color:#7fb3df;font-weight:650}.primary:hover:enabled{background:#9dc9ed}
    .aux{display:flex;align-items:center;gap:10px;min-height:26px;color:#8295a7;font-size:10px}.aux button{font-size:10px;padding:3px 7px}.aux button.on{border-color:#72c7ad;color:#bfeadb}.speed{display:flex;align-items:center;gap:4px}.speed input{width:46px;border:1px solid #42566a;border-radius:4px;background:#17212c;color:#edf4fa;text-align:right;padding:2px 4px;font:11px ui-monospace,SFMono-Regular,monospace}.speed[hidden],.aux button[hidden]{display:none}.joints{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap;font-family:ui-monospace,SFMono-Regular,monospace}.joints span{white-space:nowrap}.joints b{color:#b6c4d1;font-weight:400}.status{font-size:11px;color:#91a4b7;line-height:1.45;min-height:16px;overflow-wrap:anywhere}.status.error{color:#f3b8b0}footer .robot-state{font-size:11px;color:#9cabb9;margin-right:auto}footer button{font-size:11px;padding:5px 8px}footer .disable{border-color:#76514f;background:#372c31;color:#f2c4bf}.connection{width:min(580px,100%);font-size:11px;color:#72869a;margin-top:10px;line-height:1.5}.auth{display:flex;gap:8px;margin:8px 0}.auth input{min-width:0;flex:1;border:1px solid #42566a;border-radius:5px;background:#111b25;color:#edf4fa;padding:7px}.auth[hidden]{display:none}
    @media(max-width:460px){body{padding:16px 8px}.columns,.row{grid-template-columns:44px 65px minmax(0,1fr);gap:4px}.motion{padding:8px}.compound{gap:2px}.compound input[type=number]{width:67px}.aux{gap:8px;flex-wrap:wrap}.joints{gap:10px;margin-left:0}.sync button{padding:4px 6px}.connection{padding:0 4px}}
  </style>
</head>
<body>
  <div class="panel">
    <header><h1>MG400 Control</h1><span class="mode" id="mode">CONNECTING</span></header>
    <main>
      <form class="auth" id="auth" hidden><input id="token" type="password" placeholder="Panel access token" aria-label="Panel access token" autocomplete="off"><button type="submit">Connect</button></form>
      <div class="sync" title="Sync reads robot feedback into this page."><i class="dot" id="syncDot"></i><span class="state" id="syncState">Not connected</span><button id="startSync" disabled>Start sync</button><button id="stopSync" disabled>Stop sync</button></div>
      <section class="motion">
        <h2 title="Pose: robot base to flange. User=0, Tool=0. Slider ranges are not hardware limits.">Coordinates &amp; Motion</h2>
        <div class="columns"><span>Axis</span><span>Actual</span><span>Target</span></div>
        <div id="rows"></div>
        <div class="actions"><button id="home" disabled>Home</button><button id="copyActual" hidden disabled>Use actual</button><button class="primary" id="execute" disabled>Execute targets ↗</button></div>
        <div class="actions"><button id="initializeGripper" title="Initialization opens the jaws. Remove held objects first." hidden disabled>Initialize gripper</button><button id="stop" class="disable" hidden disabled>Stop arm</button></div>
        <div class="status" id="gripperStatus" hidden></div>
      </section>
      <div class="aux"><button id="keyboard" title="Hold one key; release requests a stop. W/S: reach. A/D: base turn. R/F: up/down. Q/E: flange yaw. Z/X: gripper open/close. Esc while keys are on: disable robot. Leaving the page or pressing Shift/Ctrl/Alt/Meta turns keys off." hidden disabled>Keyboard: OFF</button><label class="speed" id="speedField" title="Global robot speed ratio, 1–100%. Click Keyboard to apply. It also affects Home and Execute targets, not the gripper." hidden>Speed <input id="speed" type="number" min="1" max="100" step="1" value="1" aria-label="Keyboard speed percent">%</label><div class="joints" id="joints"></div></div>
      <div class="status" id="status" role="status" aria-live="polite">Connecting to the Python server…</div>
      <div class="status" id="alarms" style="white-space:pre-line" hidden></div>
    </main>
    <footer><span class="robot-state" id="robotState">—</span><button id="clearAlarm" title="Sends ClearError() only. Motion does not resume." hidden disabled>Clear alarm</button><button id="enable" disabled>Enable robot</button><button class="disable" id="disable" disabled>Disable robot</button></footer>
  </div>
  <div class="connection" id="connection">Python panel</div>
  <script>
    const $ = id => document.getElementById(id);
    const axes = [{id:'x',label:'X',unit:'mm'},{id:'y',label:'Y',unit:'mm'},{id:'z',label:'Z',unit:'mm'},{id:'r',label:'R',unit:'deg'},{id:'grip',label:'Gripper',unit:'/ 1000'}];
    let state, initialized = false, busy = false, connected = false, gripEdited = false;
    const jogKeys = new Set('WASDQERFZX');
    const modifierCodes = new Set(['ShiftLeft','ShiftRight','ControlLeft','ControlRight','AltLeft','AltRight','MetaLeft','MetaRight','OSLeft','OSRight']);
    const speedTitle = 'Global robot speed ratio, 1–100%. Click Keyboard to apply. It also affects Home and Execute targets, not the gripper.';
    let keySeq = 0, renewTimer = null, renewals = 0, offReason = null, offSending = false, arming = false;
    const held = new Set();
    const clientId = Array.from(crypto.getRandomValues(new Uint8Array(16)), value => value.toString(16).padStart(2,'0')).join('');
    let token = '';
    try { token = sessionStorage.getItem('mg400-panel-token') || ''; } catch {}
    const formatted = (value,axis) => value == null ? '—' : Number(value).toFixed(axis === 'grip' ? 0 : 3);
    function buildRows(data) {
      $('rows').innerHTML = axes.map(axis => `<div class="row"><span class="label">${axis.label}<small class="unit">${axis.unit}</small></span><span class="actual" id="${axis.id}Actual">—</span>${data.mode === 'robot' ? `<div class="compound"><input type="range" id="${axis.id}Range" aria-label="${axis.label} target slider" step="${axis.id === 'grip' ? 1 : .001}" disabled><input type="number" id="${axis.id}Target" aria-label="${axis.label} target" step="${axis.id === 'grip' ? 1 : .001}" disabled></div>` : '<span class="actual">Unavailable</span>'}</div>`).join('');
      initialized = true;
      if(data.mode !== 'robot') return;
      axes.forEach(axis => {
        const slider = $(axis.id+'Range'), number = $(axis.id+'Target');
        const edited = () => {if(axis.id === 'grip') gripEdited = true;};
        slider.addEventListener('input',() => {number.value = formatted(slider.value,axis.id);edited();});
        number.addEventListener('input',() => {if(number.value !== '' && number.validity.valid) slider.value = number.value;edited();});
        number.addEventListener('keydown',event => {if(event.key === 'Enter'){event.preventDefault();number.blur();}});
      });
    }
    function copyActual(data, onlyEmpty = false) {
      axes.forEach((axis,i) => {
        const number = $(axis.id+'Target'), slider = $(axis.id+'Range'), value = data.actual[i];
        if(value == null || !number || (onlyEmpty && number.value !== '')) return;
        const span = axis.id === 'r' ? 10 : 50;
        const range = axis.id === 'grip' ? [0,1000] : [value-span,value+span];
        slider.min = range[0]; slider.max = range[1];
        if(axis.id === 'grip') {number.min = range[0];number.max = range[1];}
        number.value = formatted(value,axis.id); slider.value = value;
      });
      if(!onlyEmpty) gripEdited = false;
    }
    function render(data) {
      state = data;
      if(!initialized) buildRows(data);
      const robot = data.mode === 'robot';
      const owner = data.controller_id === clientId;
      const active = connected && !busy && !data.busy;
      const control = active && robot && owner && data.feedback_fresh && !data.locked;
      if(robot) copyActual(data,true);
      $('mode').textContent = robot ? 'REAL ROBOT' : 'READ ONLY';
      $('syncState').textContent = !connected ? (authWait || outdated ? 'Not connected' : 'Reconnecting…') : data.syncing ? (data.feedback_fresh ? 'Live feedback' : 'Waiting for feedback') : 'Sync stopped';
      if(connected && robot && data.controller_id && !owner) $('syncState').textContent += ' · Another page has control';
      $('syncDot').classList.toggle('on',connected && data.syncing && data.feedback_fresh);
      $('startSync').textContent = robot ? 'Connect & take control' : 'Start sync';
      $('stopSync').textContent = robot ? 'Disconnect' : 'Stop sync';
      $('startSync').disabled = !active || (robot ? !!data.controller_id && (!owner || data.syncing) : data.syncing);
      $('stopSync').disabled = !connected || !data.syncing || (robot && !owner);
      $('enable').disabled = !control || data.enabled;
      $('disable').disabled = !robot || !data.syncing;
      $('home').disabled = $('execute').disabled = !control || !data.enabled;
      if(robot && axes.slice(0,4).some(axis => $(axis.id+'Target').value === '')) $('execute').disabled = true;
      $('copyActual').hidden = $('stop').hidden = !robot;
      $('copyActual').disabled = !control || data.actual.slice(0,4).some(value => value == null);
      $('stop').disabled = !robot || !data.syncing;
      $('initializeGripper').hidden = !robot;
      $('initializeGripper').disabled = !control || !data.gripper_can_initialize;
      $('gripperStatus').hidden = !robot;
      $('gripperStatus').textContent = data.gripper_message || '';
      axes.forEach((axis,i) => {
        $(axis.id+'Actual').textContent = formatted(data.actual[i],axis.id);
        if(robot) $(axis.id+'Range').disabled = $(axis.id+'Target').disabled = !control || (axis.id === 'grip' ? !data.gripper_available : $(axis.id+'Target').value === '');
      });
      const keysShown = robot && owner && !!(data.keyboard_enabled || data.keyboard_arming);
      // Renew only keys that this page still sees as ON; the server dead-man covers the rest.
      if(!(robot && owner && data.keyboard_enabled)) {held.clear();stopRenew();}
      if(!keysShown) {if(!arming) offReason = null;}
      else if(!offReason && (!document.hasFocus() || document.visibilityState !== 'visible')) {offReason = 'focus';sendOff();}
      else if(offReason) sendOff();
      $('keyboard').hidden = $('speedField').hidden = !robot;
      $('keyboard').disabled = !robot || !owner || !connected || !(keysShown || (data.syncing && data.feedback_fresh && !data.locked && data.robot_mode === 5 && !data.busy && !data.gripper_busy));
      $('keyboard').textContent = robot && data.keyboard_arming ? 'Keyboard: CHECKING…' : robot && data.keyboard_enabled ? `Keyboard: ON ${data.keyboard_speed_percent}%` : 'Keyboard: OFF';
      $('keyboard').classList.toggle('on',!!(robot && data.keyboard_enabled));
      $('speed').disabled = !robot || !owner || !data.syncing || !!data.busy || !!data.keyboard_arming;
      $('speedField').title = speedTitle + (robot && data.speed_factor != null ? ` Controller ratio: ${data.speed_factor}%.` : '');
      $('joints').innerHTML = [0,1,2,3].map(i => `<span>J${i+1} <b>${data.joints ? data.joints[i].toFixed(2)+'°' : '—'}</b></span>`).join('');
      const alarm = robot && (data.robot_mode === 9 || !!data.robot_error);
      const recover = robot && !alarm && !!data.recoverable;
      $('clearAlarm').hidden = !alarm && !recover;
      $('clearAlarm').textContent = recover ? 'Recover' : 'Clear alarm';
      $('clearAlarm').title = recover ? 'Confirms disable and rest, then unlocks control.' : 'Sends ClearError() only. Motion does not resume.';
      $('clearAlarm').disabled = !active || !owner || !data.feedback_fresh;
      $('alarms').hidden = !alarm || !data.alarms?.length;
      $('alarms').textContent = alarm ? (data.alarms || []).map(item => `Alarm ${item.id}${item.source === 'controller' ? '' : ' · '+item.source}: ${item.description}${item.solution ? '. '+item.solution : ''}`).join('\n') : '';
      $('robotState').textContent = data.robot_mode == null ? 'No feedback' : `Mode ${data.robot_mode}${data.robot_error ? ' · error' : ''}${data.feedback_fresh ? '' : ' · stale'}${data.locked ? ' · LOCKED' : ''}`;
      $('connection').textContent = robot ? `Real robot · ${data.robot_host} · XYZ/R use the robot base and flange. Home moves all four joints to 0°. Stop arm does not stop a gripper command already sent. Continuous jogging needs a person at the physical emergency stop. If stop is unconfirmed, use the physical emergency stop.` : `Read-only · ${data.robot_host} · Joint feedback only. Pose, gripper, keyboard jogging, and robot commands are unavailable.`;
      // Without a connection the last state is stale, so show why the page is offline.
      if(!errorTimer) showStatus(connected ? data.message : offline,!connected || !!data.locked);
    }
    function headers() {return {'Authorization':token ? 'Bearer '+token:'','Content-Type':'application/json','X-MG400-Panel':'1','X-MG400-Client':clientId};}
    // Stop arm, Disable robot and Disconnect always use HTTP, so they never depend on the live connection.
    async function post(payload) {
      const response = await fetch('api/command',{method:'POST',headers:headers(),signal:AbortSignal.timeout(2500),body:JSON.stringify(payload)});
      const data = await response.json();
      if(response.status === 401) $('auth').hidden = false;
      if(!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    const PROTOCOL = 1, tokenPrompt = 'Enter the panel access token', pending = new Map();
    let socket = null, opened = false, notice = '', offline = 'Not connected', authWait = false, submitted = false, outdated = false;
    let requestId = 0, retry = 0, refused = 0, retryTimer = null, liveTimer = null;
    // A socket that is not open drops sends without an error.
    const ready = () => connected && socket.readyState === WebSocket.OPEN;
    function request(type, body, timeout = 2500) {
      return new Promise((resolve, reject) => {
        if(!ready()) throw new Error(offline);
        const id = ++requestId;
        socket.send(JSON.stringify({type,id,body}));
        pending.set(id,{resolve,reject,timer:setTimeout(() => {pending.delete(id);reject(new Error('Request timed out'));},timeout)});
      });
    }
    function connect() {
      clearTimeout(retryTimer);
      const url = new URL('api/ws',location.href);
      url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = socket = new WebSocket(url.href);
      opened = false;notice = '';
      // The service pushes state at least once per second, so silence means a dead connection.
      const live = () => {clearTimeout(liveTimer);liveTimer = setTimeout(() => {if(ws === socket) closed();},3000);};
      live();
      ws.onopen = () => {if(ws !== socket) return;opened = true;refused = 0;live();ws.send(JSON.stringify({type:'hello',protocol:PROTOCOL,client:clientId,token}));};
      ws.onmessage = event => {if(ws === socket) {live();receive(event.data);}};
      ws.onclose = event => {if(ws !== socket) return;if(event.code === 4401) authWait = true;if(event.code === 4426) outdated = true;closed();};
    }
    function receive(text) {
      let message;
      try {message = JSON.parse(text);} catch {return;}
      if(message?.type === 'state') {
        if(!connected) {
          // The connection error no longer applies. A failed Stop or Disable stays visible.
          connected = true;retry = refused = 0;tokenAccepted();
          if(linkError) {clearTimeout(errorTimer);errorTimer = null;}
        }
        apply(message.state);
      } else if(message?.type === 'reply' && pending.has(message.id)) {
        const entry = pending.get(message.id);
        pending.delete(message.id);clearTimeout(entry.timer);
        if(message.status === 200) entry.resolve(message.state); else entry.reject(new Error(message.error || 'Request failed'));
      } else if(message?.type === 'error') {
        notice = message.error || 'Request failed';
        if(message.status === 401) {authWait = true;$('auth').hidden = false;}
        if(message.status === 426) outdated = true;
        showError(new Error(notice));
      }
    }
    function tokenAccepted() {
      $('auth').hidden = true;
      if(submitted) {submitted = false;try {sessionStorage.setItem('mg400-panel-token',token);} catch {}$('token').value = '';}
    }
    function drop(code) {
      const ws = socket;
      socket = null;connected = false;
      clearTimeout(liveTimer);
      try {ws?.close(code);} catch {}
      // The service turns keys off when this connection ends.
      held.clear();stopRenew();
      for(const entry of pending.values()) {clearTimeout(entry.timer);entry.reject(new Error(offline));}
      pending.clear();
    }
    function closed() {
      if(!opened) refused++;
      // A refused handshake reaches the page only as a close before open.
      offline = outdated ? notice || 'The robot service was updated. Reload the page.' : authWait ? tokenPrompt : refused >= 3 ? 'The robot service refused the connection. Retrying…' : notice || 'Connection lost. Reconnecting…';
      drop();
      // Only a reload recovers from another protocol version.
      if(outdated) {}
      else if(authWait) $('auth').hidden = false;
      else {retryTimer = setTimeout(connect,refused >= 3 ? 5000 : [500,1000,2000][retry]);retry = Math.min(retry+1,2);pollState();}
      showError(new Error(offline));
    }
    let stateTimer = null, stateReading = false;
    // Without the socket, poll the state over HTTP, so Stop arm and Disable robot stay usable.
    function pollState() {
      clearTimeout(stateTimer);stateTimer = null;
      if(connected || authWait || outdated) return;
      stateTimer = setTimeout(pollState,1000);
      if(stateReading) return;
      stateReading = true;
      const sent = token;
      fetch('api/state',{headers:headers(),signal:AbortSignal.timeout(2500)}).then(response => {
        // A refused handshake never reaches hello, so only this read can ask for the token.
        if(response.status === 401 && !connected) $('auth').hidden = false;
        // Only HTTP may work, for example behind a proxy that refuses the socket.
        if(response.ok && !connected && !authWait && sent === token) tokenAccepted();
        return response.ok ? response.json() : null;
      }).then(data => {if(data && !connected) apply(data);}).catch(() => {}).finally(() => {stateReading = false;});
    }
    const retired = new Set();
    function newer(data) {
      // Requests can finish out of order, so never accept an older snapshot.
      // Versions count per server process. A restarted server is a new instance.
      if(data?.version == null || state?.version == null) return true;
      if(retired.has(data.instance)) return false;
      if(data.instance !== state.instance) {retired.add(state.instance);return true;}
      return data.version >= state.version;
    }
    function apply(data) {if(newer(data)) render(data);}
    let errorTimer = null, linkError = false, interruptError = false;
    function showStatus(text, error) {
      if($('status').textContent !== text) $('status').textContent = text;
      $('status').classList.toggle('error',error);
    }
    function showError(error, interrupt = false) {
      // A failed Stop arm or Disable robot stays visible for its 3 s through connection
      // errors, including requests that the closed socket rejects after the failure.
      const connectionError = error.message === offline || error.message === 'Request timed out';
      if(!interrupt && interruptError && errorTimer && connectionError && !authWait && !outdated) {
        if(state) render(state);
        return;
      }
      linkError = !connected && error.message === offline;
      interruptError = interrupt;
      // Keep the error readable for 3 s, although state pushes arrive in between.
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => {errorTimer = null;if(state) render(state);},3000);
      if(state) render(state);
      showStatus(error.message,true);
    }
    function heartbeat() {
      if(connected && owns()) request('heartbeat',{}).catch(showError);
      setTimeout(heartbeat,500);
    }
    async function command(action) {
      const interrupt = ['stop','disable','stop_sync'].includes(action);
      if(busy && !interrupt) return;
      if(!interrupt) busy = true;
      render(state);
      let failure;
      try {
        const payload = {action};
        if(action === 'execute') {
          const included = axes.filter(axis => axis.id !== 'grip' || gripEdited);
          payload.targets = Object.fromEntries(included.map(axis => {
            const input = $(axis.id+'Target');
            if(input.value === '' || !input.validity.valid || !Number.isFinite(Number(input.value))) throw new Error('Enter a valid target for '+axis.label);
            return [axis.id,Number(input.value)];
          }));
        }
        if(interrupt) {
          // HTTP covers a socket that died silently. The open socket skips a new TCP handshake.
          // A repeated stop_sync after the disconnect would be refused, so it uses HTTP only.
          const paths = [post(payload)];
          if(action !== 'stop_sync' && ready()) paths.push(request('command',payload));
          const results = await Promise.allSettled(paths.map(path => path.then(apply)));
          if(results.every(result => result.status === 'rejected')) throw results[0].reason;
        } else {
          const data = await request('command',payload);
          if(newer(data)) state = data;
        }
        if(action === 'execute') gripEdited = false;
      } catch(error) {failure = error;}
      finally {if(!interrupt) busy = false;render(state);if(failure) showError(failure,interrupt);}
    }
    ['enable','disable','home','stop'].forEach(id => $(id).addEventListener('click',() => command(id)));
    $('execute').addEventListener('click',() => command('execute'));
    $('copyActual').addEventListener('click',() => copyActual(state));
    $('initializeGripper').addEventListener('click',() => command('initialize_gripper'));
    $('clearAlarm').addEventListener('click',() => command('clear_alarm'));
    $('startSync').addEventListener('click',() => command('start_sync'));
    $('stopSync').addEventListener('click',() => command('stop_sync'));
    $('auth').addEventListener('submit',event => {event.preventDefault();token = $('token').value.trim();submitted = true;authWait = false;if(socket) closed();connect();});
    const keyName = event => event.code.startsWith('Key') ? event.code.slice(3) : event.code;
    const owns = () => state?.mode === 'robot' && state.controller_id === clientId;
    const keysOn = () => owns() && !!state.keyboard_enabled;
    const keysArmed = () => owns() && !!(state.keyboard_enabled || state.keyboard_arming);
    function stopRenew() {clearInterval(renewTimer);renewTimer = null;}
    async function sendKeys(renewal = false) {
      if(renewal) renewals++;
      try {apply(await request('keys',{seq:++keySeq,held:[...held]},1000));}
      catch(error) {
        const release = held.size > 0 && ready();
        held.clear();stopRenew();
        // A sent key frame cannot be withdrawn. One newer release ends a press applied late.
        if(release) request('keys',{seq:++keySeq,held:[]},1000).then(apply,showError);
        showError(error);
      }
      finally {if(renewal) renewals--;}
    }
    function renew() {
      if(!held.size) {stopRenew();return;}
      if(!document.hasFocus() || document.visibilityState !== 'visible') {dropKeys('focus');return;}
      // At most two renewals in flight and none behind unsent data, so a release never waits in a backlog.
      if(renewals < 2 && !socket?.bufferedAmount) sendKeys(true);
    }
    function keysChanged() {
      sendKeys();
      if(!held.size) stopRenew();
      else if(!renewTimer) renewTimer = setInterval(renew,100);
    }
    function dropKeys(reason) {
      const releasing = held.size > 0;
      held.clear();stopRenew();
      if(releasing) sendKeys();
      // A disarm sent while the arm request is in flight carries a newer seq and wins.
      if(reason && (keysArmed() || arming)) {offReason = reason;sendOff();}
    }
    async function sendOff() {
      // Without the socket the service already turned keys off. A reconnect renders that.
      if(offSending || !offReason || !ready()) return;
      offSending = true;
      try {apply(await request('command',{action:'keyboard',enabled:false,reason:offReason,seq:++keySeq}));}
      catch(error) {showError(error);}
      finally {offSending = false;}
    }
    async function keyboardOn() {
      if(arming) return;
      dropKeys(null);
      offReason = null;
      const speed = Number($('speed').value);
      if(!Number.isInteger(speed) || speed < 1 || speed > 100) {showError(new Error('Enter a keyboard speed from 1 to 100'));return;}
      arming = true;
      try {apply(await request('command',{action:'keyboard',enabled:true,speed,seq:++keySeq}));} catch(error) {showError(error);} finally {arming = false;if(offReason) sendOff();}
    }
    $('keyboard').addEventListener('click',() => keysArmed() ? dropKeys('user') : keyboardOn());
    window.addEventListener('keydown',event => {
      if(!owns()) return;
      const key = keyName(event);
      if(key === 'Escape') {
        if(keysArmed() || held.size || arming) {event.preventDefault();dropKeys(null);command('disable');}
        return;
      }
      if(!keysArmed() && !held.size && !arming) return;
      if(event.ctrlKey || event.metaKey || event.altKey || event.shiftKey || modifierCodes.has(event.code)) {dropKeys('modifier');return;}
      if(!jogKeys.has(key) || event.target instanceof HTMLInputElement) return;
      event.preventDefault();
      // A requested disarm wins: new presses wait until the server shows keys OFF.
      if(event.repeat || event.isComposing || !connected || !keysOn() || offReason || held.has(key)) return;
      held.add(key);
      keysChanged();
    });
    window.addEventListener('keyup',event => {if(held.delete(keyName(event))) keysChanged();});
    window.addEventListener('blur',() => dropKeys('focus'));
    window.addEventListener('contextmenu',() => dropKeys('focus'));
    window.addEventListener('dragstart',() => dropKeys('focus'));
    document.addEventListener('visibilitychange',() => {if(document.visibilityState !== 'visible') dropKeys('focus');});
    document.addEventListener('focusin',event => {if(event.target instanceof HTMLInputElement) dropKeys(event.target.id === 'speed' ? 'speed' : 'edit');});
    window.addEventListener('pagehide',() => {
      if(state?.mode === 'robot' && state.syncing && state.controller_id === clientId) fetch('api/command',{method:'POST',headers:headers(),body:JSON.stringify({action:'stop'}),keepalive:true}).catch(() => {});
      // A hidden page keeps no connection and does not reconnect.
      clearTimeout(retryTimer);clearTimeout(stateTimer);
      offline = 'Not connected';
      drop(1000);
    });
    window.addEventListener('pageshow',event => {if(event.persisted && !authWait && !outdated) {drop(1000);if(state) render(state);connect();}});
    connect();
    heartbeat();
  </script>
</body>
</html>
