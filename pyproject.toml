[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mg400-agent"
version = "0.1.0"
description = "Real-robot control for a Dobot MG400 and electric gripper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "websockets>=15,<18"]
notebook = ["ipykernel==7.4.0"]

[project.scripts]
mg400-robot = "mg400_agent.terminal_control:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["work", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I"]
