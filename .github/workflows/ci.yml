name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit finishes its full run; a new PR push replaces the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Test the minimum supported version used by the Olares host.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out a merge commit; its first parent is the base.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Python tests
        # Pull requests run the changed areas' tests; pushes to main run the full suite.
        # 3 workers on the 4-vCPU runner; loadfile keeps each file's tests in one worker.
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # A failed diff stops the step. --no-renames also lists the old path of a moved file.
            changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
            mapfile -t targets < <(printf '%s\n' "$changed" | uv run python scripts/select_tests.py)
          else
            targets=(tests)
          fi
          printf 'pytest target: %s\n' "${targets[@]}"
          uv run pytest -ra -n 3 --dist loadfile "${targets[@]}"
      - name: JavaScript tests
        run: node --test tests/*.mjs

  stage-firmware:
    name: Stage firmware native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install a 32-bit compiler
        # The checks need a 32-bit long and 32-bit float math, as on the AVR.
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends g++-multilib
      - name: Run the checks
        run: python3 firmware/stage-controller-v3/tests/run.py --compiler-arg=-m32 --compiler-arg=-msse2 --compiler-arg=-mfpmath=sse
