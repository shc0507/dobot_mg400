[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mg400"
version = "0.1.0"
description = "Real-robot control for a Dobot MG400, an electric gripper, and a three-motor stage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "websockets>=15,<18", "httpx>=0.28,<1"]
notebook = ["ipykernel==7.4.0"]
stage = ["flask>=3.1,<4", "pyserial>=3.5,<4", "waitress>=3.0.2,<4"]
tools = ["pysmb>=1.2.15,<2"]
thermal = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=1.26,<3",
  "pyusb>=1.3,<2",
  "libusb-package>=1.0.26,<2",
]
vision = [
  "numpy>=1.26,<3",
  "pillow>=10.1,<13",
  "zxing-cpp>=3.0,<4",
  "opencv-python-headless>=4.9,<5",
]
vision-gpu = ["ultralytics>=8.4,<9", "torch>=2.7", "torchvision>=0.22"]

[project.scripts]
mg400-robot = "mg400.terminal_control:main"
stage-panel = "stage_controller.__main__:main"
thermal-cam = "thermal_cam.__main__:main"

[tool.uv]
default-groups = ["dev", "stage", "vision", "thermal"]
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/mg400", "src/stage_controller", "src/labkit", "src/vision", "src/thermal_cam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Preserve the pinned third-party USB driver without formatting changes.
extend-exclude = ["work", ".agents", "src/thermal_cam/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
