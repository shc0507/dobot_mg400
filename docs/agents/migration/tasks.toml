# Task graph for the lab integration migration. Cards: tasks.md. Rules: README.md.
#
# Fields
#   id      Unique. Two to three capital letters, a hyphen, two digits.
#   title   Same text as the card heading in tasks.md.
#   phase   0-6, see README.md section 10. Informational; deps decide order.
#   track   Groups related tasks. GOV-01 turns it into a mig:<track> label.
#   owner   agent | human | agent+human
#   size    S (under half a day of agent work) | M (about a day) | L (several days)
#   review  agent | human. "human" means the repo owner approves the PR before merge.
#   deps    Ids that must be closed before this task starts.
#   writes  Files this task may change (glob patterns). Human tasks write nothing here.
#
# tests/test_migration_plan.py checks this file against tasks.md.
# Status is not kept here. It lives in the GitHub issues that GOV-01 creates.

