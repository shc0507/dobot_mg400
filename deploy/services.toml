# One entry per implemented service. Add optional services with their unit files.
# The first unit starts its companions through systemd dependencies.
# Optional udev template: config/udev/70-mg400-<name>.rules.in.

[[service]]
name = "web"
units = ["mg400-web-panel.service"]
optional = false
venv = ".venv"
groups = ["tools"]
token = "MG400_PANEL_TOKEN"
port = 8766
assets = []

[[service]]
name = "thermal"
units = ["mg400-thermal.service"]
optional = true
venv = ".venv"
groups = ["thermal"]
token = "MG400_THERMAL_TOKEN"
port = 8768
assets = []

