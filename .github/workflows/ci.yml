name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Test the minimum supported version used by the Olares host.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out a merge commit; its first parent is the base.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Python tests
        # Pull requests run the changed areas' tests; pushes to main run the full suite.
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            mapfile -t targets < <(git diff --name-only HEAD^1 HEAD | uv run python scripts/select_tests.py)
          else
            targets=(tests)
          fi
          printf 'pytest target: %s\n' "${targets[@]}"
          uv run pytest -ra "${targets[@]}"
      - name: JavaScript tests
        run: node --test tests/*.mjs
