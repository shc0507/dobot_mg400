# One entry per implemented service. Add optional services with their unit files.
# The first unit starts its companions through systemd dependencies.
# Optional udev template: config/udev/70-mg400-<name>.rules.in.

[[service]]
name = "web"
units = ["mg400-web-panel.service"]
optional = false
venv = ".venv"
groups = ["tools"]
port = 8766
assets = []

[[service]]
name = "vision"
units = ["mg400-vision.service"]
optional = true
venv = ".venv-vision"
groups = ["vision", "vision-gpu"]
port = 8771
assets = ["vision-weights"]

[[service]]
name = "thermal"
units = ["mg400-thermal.service"]
optional = true
venv = ".venv"
groups = ["thermal"]
port = 8768
assets = []

[[service]]
name = "furnace"
units = ["mg400-furnace.service"]
optional = false
venv = ".venv"
groups = ["furnace"]
port = 8769
assets = []

[[service]]
name = "microscope"
units = ["mg400-microscope.service"]
optional = false
venv = ".venv"
groups = ["microscope"]
port = 8770
assets = []

[[service]]
name = "orch"
units = ["mg400-orchestrator.service"]
optional = false
venv = ".venv"
groups = ["orchestrator"]
port = 8772
assets = []

[[service]]
name = "gateway"
units = ["mg400-gateway.service"]
optional = true
venv = ".venv"
groups = ["gateway"]
port = 8773
assets = []

[[service]]
name = "stage"
units = ["mg400-stage-panel.service"]
optional = false
venv = ".venv"
groups = ["stage"]
port = 8767
assets = []

[[service]]
name = "camera"
units = ["mg400-camera-preview.service", "mg400-camera-capture.service"]
optional = false
venv = ".venv"
groups = []
port = 1985
assets = []

[[service]]
name = "collector"
units = ["mg400-gripper-collector.service"]
optional = false
venv = ".venv"
groups = ["stage"]
port = 0
assets = []

[[service]]
name = "proxy"
units = ["mg400-proxy.service"]
optional = false
venv = ".venv"
groups = []
port = 8080
assets = []
