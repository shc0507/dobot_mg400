name = "Vision-guided tray transfer"
version = 1

[params.from_slot]
type = "string"

[params.to_slot]
type = "string"

[params.speed]
type = "integer"
default = 1

[[steps]]
skill = "vision.tray_transfer"
params = { from_slot = "${from_slot}", to_slot = "${to_slot}", speed = "${speed}" }
timeout_s = 120
on_fail = "hold"
